name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Ensures that if you push a new commit, the previous stale run is cancelled
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-format-types-test:
    name: Lint, format check, typecheck & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # This automatically reads the "engines" field in package.json
          node-version-file: 'package.json'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Check types
        run: npm run check-types

      - name: Audit dependencies
        run: npm run check-dependencies

      - name: Test
        run: npm run test

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # BFF plus the storefront's production (standalone) build with .env.e2e
      - name: Build for E2E
        run: npm run build -w @test/e2e

      # Only the browser the projects use
      - name: Install Chromium
        working-directory: test/e2e
        run: npx playwright install --with-deps chromium

      # Mock data source for every category: no credentials, no outside service
      - name: Run E2E suite
        run: npm run e2e

      - name: Upload report and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test/e2e/playwright-report
            test/e2e/test-results
          retention-days: 14
